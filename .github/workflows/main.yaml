##
## This workflow handles testing of pull requests and pushes.
## It also publishes some packages to any new Erlang/OTP release
##
## To speed this up it would be nice if one could share docker
## images inbetween different jobs, but at the moment this is
## not possible so we need to rebuild all of Erlang/OTP multiple
## times.
##
## Now that we have migrated to ghcr.io we use the
## built-in caching mechanisms of docker/build-push-action@v2.
## However as things are now we use docker directly to make things
## work due to historical reasons.
##

name: Build and check Erlang/OTP

on:
  push:
  pull_request:
  schedule:
      - cron: 0 1 * * *

## We cancel any multiple runs from PRs, while runs from tags/branches are allowed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check-files:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-check-files.yaml
    with:
      pr_base_sha:  ${{ github.event.pull_request.base.sha }}
      pr_head_sha:  ${{ github.event.pull_request.head.sha }}
      pr_author:    ${{ github.event.pull_request.user.login }}
      repository:   ${{ github.repository }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  setup:
    uses: ./.github/workflows/reusable-setup.yaml

  pack:
    name: Build Erlang/OTP (64-bit)
    needs: setup
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-pack.yaml
    with:
      base_branch:          ${{ needs.setup.outputs.base_branch }}
      full_build_and_check: ${{ needs.setup.outputs.full_build_and_check }}
      bypass_erlang_repo:   false

  build-macos:
    name: Build Erlang/OTP (macOS)
    needs: pack
    permissions:
      contents: read
      actions:  write
    if: needs.pack.outputs.build-c-code == 'true'
    uses: ./.github/workflows/reusable-build-macos.yaml
    with:
      base_branch: ${{ needs.pack.outputs.base_branch }}

  build-ios:
    name: Build Erlang/OTP (iOS)
    needs: pack
    if: needs.pack.outputs.build-c-code == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-build-ios.yaml
    with:
      base_branch: ${{ needs.pack.outputs.base_branch }}

  build-windows:
    name: Build Erlang/OTP (Windows)
    needs: pack
    if: needs.pack.outputs.build-c-code == 'true' || (github.event_name == 'push' && github.repository == 'erlang/otp')
    permissions:
      contents: read
      actions:  write
    uses: ./.github/workflows/reusable-build-windows.yaml
    with:
      base_branch: ${{ needs.pack.outputs.base_branch }}

  build-flavors:
    name: Build Erlang/OTP (Types and Flavors)
    needs: pack
    if: needs.pack.outputs.build-c-code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build-flavours.yaml
    with:
      base_branch: ${{ needs.pack.outputs.base_branch }}
      types: "opt debug lcnt asan gcov valgrind"

  # this is a call to a workflow_call
  pr-vendor-vulnerability-analysis:
    needs: pack
    if: ${{ github.event_name == 'pull_request' && github.repository == 'erlang/otp'}}
    permissions:
      contents: read
      actions: write
      issues: write
    name: Vendor Vulnerability Scanning
    # This is an internal and trusted workflow.
    uses: ./.github/workflows/reusable-vendor-vulnerability-scanner.yml # zizmor: ignore[secrets-inherit]
    with:
      fail_if_cve: false
      checkout:    true
      version:     ${{ needs.pack.outputs.base_branch }}
      # `fail_if_cve` must always be `false`. the reason is that the reusable workflow tries to open
      # a GH Issue if it finds a vulnerability. however, this can only work on internal PRs or PRs coming
      # from a repo branch. this is a security limitation as otherwise, forked repos could create pull
      # requests against Erlang/OTP which start creating automatic issues.
    secrets: inherit

  build:
    name: Build Erlang/OTP
    needs: pack
    if: needs.pack.outputs.build-c-code == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build-otp.yaml
    with:
      base_branch: ${{ needs.pack.outputs.base_branch }}

  freebsd:
    name: Build Erlang/OTP (FreeBSD)
    needs: pack
    permissions:
      contents: read
      actions: read
    if: needs.pack.outputs.build-c-code == 'true'
    uses: ./.github/workflows/reusable-freebsd.yaml
    with:
      base_branch: ${{ needs.pack.outputs.base_branch }}

  openbsd:
    name: Build Erlang/OTP (OpenBSD)
    needs: pack
    if: needs.pack.outputs.build-c-code == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-openbsd.yaml
    with:
      base_branch: ${{ needs.pack.outputs.base_branch }}

  solaris:
    name: Build Erlang/OTP (Solaris)
    needs: pack
    if: needs.pack.outputs.build-c-code == 'true' && false # Temporarily disable Solaris build as the VM image is currently broken
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-solaris.yaml
    with:
      base_branch: ${{ needs.pack.outputs.base_branch }}

  documentation:
    name: Build and Check Documentation
    needs:
      - setup
      - pack
    permissions:
      contents: read
      actions:  write
    uses: ./.github/workflows/reusable-documentation.yaml
    secrets:
      TRIGGER_ERLANG_ORG_BUILD: ${{ secrets.TRIGGER_ERLANG_ORG_BUILD }}
    with:
      base_branch:              ${{ needs.setup.outputs.base_branch }}
      base_url:                 ${{ needs.setup.outputs.docs_base_url  }}
      trigger_erlang_org_build: ${{ github.ref_name == 'master' && github.repository == 'erlang/otp' }}

  static:
    name: Run static analysis
    needs:
      - setup
      - pack
    permissions:
      contents: read
      security-events: write   # needed for SARIF upload
    uses: ./.github/workflows/reusable-static-analysis.yaml
    with:
      base_branch:              ${{ needs.setup.outputs.base_branch }}

  test-windows:
    name: Test Win64 Erlang/OTP
    needs: [pack, build-windows]
    defaults:
      run:
        shell: wsl-bash {0}
    runs-on: windows-2022
    if: needs.pack.outputs.changes != '[]'
    timeout-minutes: 60  # TEMP fast-debug: cap so a hanging suite dies fast
    strategy:
      matrix:
        # TEMP fast-debug: only the failing apps (restore the fromJson line after)
        type: ["emulator","ssl","kernel"]
        # type: ${{ fromJson(needs.pack.outputs.changes) }}
      fail-fast: false
    steps:
      - name: Setup nl behaviour for wsl
        shell: cmd
        run: git config --global core.autocrlf input
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: ./.github/actions/setup-wsl-runner
        with:
          installer_name: ${{ needs.build-windows.outputs.installer_name }}

      - name: Run tests
        id: run-tests
        run: |
          set -x
          unzip -q tests.zip
          export ERL_TOP="$(pwd)"
          export MAKEFLAGS=-j$(($(nproc) + 2))

          eval `./otp_build env_win32 x64`

          export PATH=`pwd`/release/win32/bin/:$PATH

          APP="${{ matrix.type }}"
          TYPE=opt
          ## TEMP fast-debug: run only the currently-failing suites per app so
          ## each iteration takes minutes (restore full "ts:run($APP,...)" after).
          case "${APP}" in
            emulator) SUITES=", [distribution_SUITE,driver_SUITE]" ;;
            ssl)      SUITES=", [ssl_api_SUITE,dtls_api_SUITE]" ;;
            kernel)   SUITES=", [socket_ttest_SUITE]" ;;  # the leak source (shutdown hang)
            *)        SUITES="" ;;
          esac
          ## Need to specialize for epmd, emulator and debug
          case "${APP}" in
            debug)
               echo "No debug tests on windows"
               ;;
            *)
               ## TEMP diagnostic: background monitor of leaked OS erl.exe
               ## processes (peer/ttest nodes) over time.
               ( while true; do echo "=OSMON $(date -u +%H:%M:%S) erl_exe=$(tasklist.exe 2>/dev/null | grep -ci 'erl.exe')"; sleep 20; done ) &
               OSMON=$!
               ## Force a clean exit with erlang:halt/0 instead of a graceful
               ## "-s init stop": on Windows some suites (e.g. the socket ttest
               ## group) leak a peer node/process that makes init:stop() block
               ## for hours after the tests have already completed. Also spawn
               ## an in-VM monitor of nodes/procs/ports over time.
               (cd release/tests/test_server && erl.exe -env USER ${USER} -env OTP_WINDOWS_CI true -emu_type $TYPE -noinput -eval 'spawn(fun F() -> io:format("=ERLMON t=~w nodes=~w procs=~w ports=~w~n",[erlang:system_time(second),length(nodes()),erlang:system_info(process_count),length(erlang:ports())]), timer:sleep(20000), F() end)' -eval "ts:install()" -eval "(catch ts:run(${APP}${SUITES},[batch])), erlang:halt()")
               kill $OSMON 2>/dev/null || true
               if grep "^=result[ ]*failed:" release/tests/test_server/ct_run.*/tests.${APP}_test.logs/run*/suite.log; then
                  exit 1
               fi
               ;;
          esac

      - name: Cleanup tests
        if: ${{ !cancelled() && matrix.type != 'debug' }}
        run: tar czf ${{ matrix.type }}_win32_test_results.tar.gz release/tests/test_server
      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6.0.0
        if: ${{ !cancelled() && matrix.type != 'debug' }}
        with:
          name: ${{ matrix.type }}_win32_test_results
          path: ${{ matrix.type }}_win32_test_results.tar.gz

  system-test-windows:
    name: Test Win64 Erlang/OTP (system)
    defaults:
      run:
        shell: wsl-bash {0}
    runs-on: windows-2022
    if: ${{ !cancelled() }} # Run even if the need has failed
    needs: [test-windows, build-windows]
    steps:
      - name: Setup nl behaviour for wsl
        shell: cmd
        run: git config --global core.autocrlf input
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: ./.github/actions/setup-wsl-runner
        with:
          installer_name: ${{ needs.build-windows.outputs.installer_name }}

      - name: Download test results
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # ratchet:actions/download-artifact@v6.0.0
      - name: Merge test results
        run: |
          shopt -s nullglob
          for file in *_win32_test_results/*.tar.gz; do
            tar xvzf $file
          done
          export PATH=`pwd`/release/win32/bin/:$PATH
          cd release/tests/test_server && ct_run.exe -noshell -refresh_logs $(wslpath -w `pwd`)

      - name: Run system tests
        run: |
          set -x
          unzip -q -o tests.zip

          export ERL_TOP="$(pwd)/otp"
          export MAKEFLAGS=-j$(($(nproc) + 2))

          eval `./otp_build env_win32 x64`

          export PATH=`pwd`/release/win32/bin/:$PATH

          (cd release/tests/test_server && erl.exe -noshell -env OTP_WINDOWS_CI true -eval "ts:install()" -eval "ts:run(system,[batch])" -s init stop)
          if grep "^=result[ ]*failed:" release/tests/test_server/ct_run.*/tests.system_test.logs/run*/suite.log; then
               exit 1
          fi

      - name: Cleanup tests
        if: ${{ !cancelled() }}
        run: |
          tar czf test_results_win32.tar.gz release/tests/test_server
          
      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6.0.0
        if: ${{ !cancelled() }}
        with:
          name: test_results_win32
          path: test_results_win32.tar.gz

  test:
    name: Test Erlang/OTP
    needs: pack
    if: needs.pack.outputs.changes != '[]'
    permissions:
      contents: read
      actions:  write
    uses: ./.github/workflows/reusable-test.yaml
    with:
      changes:     ${{ needs.pack.outputs.changes }}
      base_branch: ${{ needs.pack.outputs.base_branch }}

  system-test:
    name: Test Erlang/OTP (system)
    if: ${{ !cancelled() && needs.pack.result == 'success' }} # Run even if the need has failed
    permissions:
      contents: read
      actions:  write
    needs:
      - pack
      - test
    uses: ./.github/workflows/reusable-system-test.yaml
    with:
      base_branch: ${{ needs.pack.outputs.base_branch }}

  ## If you want to speedup this step for testing the easiest way is to create
  ## these two commits:
  ##
  ##   git rm -rf lib erts system && git revert HEAD
  ##
  ## and then create a step that that does this:
  ##
  ##   - name: SBOM Sha
  ##     run: echo "sha=$(git rev-parse HEAD~1)" >> $GITHUB_OUTPUT
  ##
  ## and then make sure to use that sha instead of env.OTP_SBOM_VERSION
  sbom:
    name: Create SBOM
    needs:
      - setup
      - pack
    uses: ./.github/workflows/reusable-sbom.yaml
    permissions:
      contents: write
      actions:  write
      packages: read
      id-token: write
    with:
      base_branch:                   ${{ needs.setup.outputs.base_branch }}
      full_build_and_check:          ${{ needs.setup.outputs.full_build_and_check }}
      otp_sbom_version:              ${{ needs.setup.outputs.otp_sbom_version }}
      verify_sbom:                   true

  ## If this is an "OTP-*" tag that has been pushed we do some release work
  release:
    name: Release Erlang/OTP
    needs:
      - setup
      - sbom
      - documentation
    permissions:
      contents:     write
      attestations: write
      id-token:     write
      actions:      write
    if: startsWith(github.ref, 'refs/tags/OTP-') && github.repository == 'erlang/otp'
    uses: ./.github/workflows/reusable-release.yaml
    with:
      otp_sbom_version: ${{ needs.setup.outputs.otp_sbom_version }}
      tag:              ${{ needs.setup.outputs.tag }}
      vsn:              ${{ needs.setup.outputs.vsn }}
    secrets:
      TRIGGER_ERLANG_ORG_BUILD: ${{ secrets.TRIGGER_ERLANG_ORG_BUILD }}
      # GITHUB_TOKEN is already available in called workflow.

  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6.0.0
        with:
          name: Event File
          path: ${{ github.event_path }}

  # Zizmor is a GitHub Actions security linter.
  # See: https://docs.zizmor.sh/
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # ratchet:zizmorcore/zizmor-action@v0.5.2

  # This job checks that the most important jobs are successful.
  # the use of conditionals, e.g., `if:` at the job level makes
  # the jobs included in the GH Settngs Ruleset to fail.
  # Instead of removing those jobs from being tested or letting
  # them fail, the script below marks as OK a skipped job.
  # a failed job is a failure, and an success job is success.
  ruleset-checker:
    name: Ruleset Checker
    runs-on: ubuntu-latest
    if: always()
    needs:
      - pack
      - build-macos
      - build-ios
      - build-windows
      - build-flavors
      - build
      - freebsd
      - openbsd
      - solaris
      - documentation
      - static
      - test
      - system-test
      - sbom
      - zizmor
    steps:
      - name: Check Ruleset Results
        shell: bash
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          failed=false
          while IFS= read -r entry; do
            name=$(echo "$entry"   | jq -r '.[0]')
            result=$(echo "$entry" | jq -r '.[1]')
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "❌ Job '$name' was: $result"
              failed=true
            else
              echo "✅ Job '$name' was: $result"
            fi
          done < <(echo "$RESULTS" | jq -c 'to_entries[] | [.key, .value.result]')
          if [[ "$failed" == "true" ]]; then
            exit 1
          fi
