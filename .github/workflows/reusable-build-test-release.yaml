name: Build Erlang/OTP test release
run-name: "[${{ inputs.base_branch }}] Build Erlang/OTP test release"

on:
  workflow_call:
    inputs:
      base_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-test-release:
    name: Build Erlang/OTP test release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Download source archive
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # ratchet:actions/download-artifact@v6.0.0
        with:
          name: otp_prebuilt

      - name: Build test release
        run: |
          tar -xzf otp_src.tar.gz
          cd otp
          export ERL_TOP="$PWD"
          export MAKEFLAGS=-j$(($(nproc) + 2))
          make release_tests
          zip -q -r ../tests.zip release/tests

      - name: Upload test release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6.0.0
        with:
          name: otp_tests
          path: tests.zip
          if-no-files-found: error
