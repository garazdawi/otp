name: Prepare Windows tests
run-name: "[${{ inputs.base_branch }}] Prepare Windows tests"

on:
  workflow_call:
    inputs:
      base_branch:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-test-release:
    name: Build Erlang/OTP test release
    runs-on: ubuntu-latest
    permissions:
      contents: read   # actions/checkout + ./.github/actions/build-base-image
      actions: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-base-image
        with:
          BASE_BRANCH: ${{ inputs.base_branch }}

      - name: Build test release
        run: |
          mkdir -p test-release/release/tests
          docker run --rm \
            -v "$PWD/test-release:/github" \
            otp "make TESTROOT=/github/release/tests release_tests"
          (cd test-release && zip -q -r ../tests.zip release/tests)

      - name: Upload test release
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6.0.0
        with:
          name: otp_tests
          path: tests.zip
          if-no-files-found: error
