name: Test Erlang/OTP (Windows)
run-name: "[${{ inputs.base_branch }}] Test Erlang/OTP (Windows)"

on:
  workflow_call:
    inputs:
      base_branch:
        required: true
        type: string
      changes:
        required: true
        type: string
      installer_name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-windows:
    name: Test Win64 Erlang/OTP
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: wsl-bash {0}
    env:
      OPENSSL_SHA256: 603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a
      OPENSSL_VERSION: 3.5.9
      WSLENV: OPENSSL_SHA256:OPENSSL_VERSION
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        type: ${{ fromJson(inputs.changes) }}
      fail-fast: false
    steps:
      - name: Setup nl behaviour for wsl
        shell: cmd
        run: git config --global core.autocrlf input

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-wsl-runner
        with:
          installer_name: ${{ inputs.installer_name }}

      - name: Cache WSL OpenSSL
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # ratchet:actions/cache@v5.0.3
        with:
          path: .cache/openssl-${{ env.OPENSSL_VERSION }}
          key: wsl-openssl-${{ env.OPENSSL_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build WSL OpenSSL
        run: |
          PREFIX="$PWD/.cache/openssl-${OPENSSL_VERSION}"
          if [ ! -x "$PREFIX/bin/openssl" ]; then
             DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential curl perl
             BUILD_DIR=$(mktemp -d)
             trap 'rm -rf "$BUILD_DIR"' EXIT
             ARCHIVE="openssl-${OPENSSL_VERSION}.tar.gz"
             curl -fL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/${ARCHIVE}" -o "$BUILD_DIR/$ARCHIVE"
             echo "${OPENSSL_SHA256}  $BUILD_DIR/$ARCHIVE" | sha256sum -c -
             tar -xzf "$BUILD_DIR/$ARCHIVE" -C "$BUILD_DIR"
             (
                cd "$BUILD_DIR/openssl-${OPENSSL_VERSION}"
                ./Configure linux-x86_64 no-shared \
                   --prefix="$PREFIX" --openssldir="$PREFIX/ssl"
                make -j$(nproc)
                make install_sw
             )
          fi
          ln -sf "$PREFIX/bin/openssl" /usr/local/bin/openssl
          "$PREFIX/bin/openssl" version -a

      - name: Run tests
        id: run-tests
        env:
          MATRIX_TYPE: ${{ matrix.type }}
        run: |
          set -x
          unzip -q tests.zip
          export ERL_TOP="$(pwd)"
          export MAKEFLAGS=-j$(($(nproc) + 2))

          eval `./otp_build env_win32 x64`

          export PATH="$PWD/.cache/openssl-${OPENSSL_VERSION}/bin:$PWD/release/win32/bin:$PATH"
          openssl version

          APP="${MATRIX_TYPE}"
          TYPE=opt
          ## Need to specialize for epmd, emulator and debug
          case "${APP}" in
            debug)
               echo "No debug tests on windows"
               ;;
            *)
               ## Run with the re-run-failed mechanism (ts_run reads
               ## CT_RERUN_FAILED=N): a failure that passes on an isolated
               ## re-run (flaky / leak-induced) does not gate; only failures
               ## that fail every re-run do. Force a clean exit with
               ## erlang:halt/0 because socket_ttest_SUITE leaks a peer node
               ## that otherwise blocks init:stop() for hours.
               find release/tests -name ct_rerun_verdict -delete 2>/dev/null || true
               if [ -f "release/tests/${APP}_test/${APP}_gh.spec" ]; then
                  RUN_TESTS="ts:run_category(${APP},gh,[batch])"
               else
                  RUN_TESTS="ts:run(${APP},[batch])"
               fi

               ## Some suites finish and write their verdict, but leave a Windows
               ## process holding the WSL stdio pipe open. Log the remaining
               ## processes before terminating Erlang so the leak can be traced.
               VERDICT="release/tests/${APP}_test/ct_rerun_verdict"
               (
                  set +x
                  while [ ! -f "$VERDICT" ]; do sleep 5; done
                  sleep 15
                  echo "::warning::Test verdict exists, but erl.exe has not exited; dumping Windows processes"
                  powershell.exe -NoProfile -Command \
                     'Get-CimInstance Win32_Process | Where-Object { @("erl.exe", "werl.exe", "epmd.exe", "inet_gethost.exe", "conhost.exe") -contains $_.Name } | Sort-Object ParentProcessId,ProcessId | Format-List Name,ProcessId,ParentProcessId,CreationDate,ExecutablePath,CommandLine | Out-String -Width 4096'
                  epmd.exe -names || true
                  netstat.exe -ano || true
                  taskkill.exe /F /T /IM erl.exe || true
                  taskkill.exe /F /IM epmd.exe || true
               ) &
               WATCHDOG=$!
               (cd release/tests/test_server && erl.exe -env USER ${USER} -env OTP_WINDOWS_CI true -env CT_RERUN_FAILED 2 -emu_type $TYPE -noinput -eval "ts:install()" -eval "(catch ${RUN_TESTS}), erlang:halt()") || true
               kill "$WATCHDOG" 2>/dev/null || true
               wait "$WATCHDOG" 2>/dev/null || true
               VERDICT=$(find release/tests -name ct_rerun_verdict 2>/dev/null | head -1)
               if [ -n "$VERDICT" ]; then
                  echo "ct_rerun verdict: $(cat "$VERDICT")"
                  if grep -q '^FAIL' "$VERDICT"; then exit 1; fi
               elif grep "^=result[ ]*failed:" release/tests/test_server/ct_run.*/tests.${APP}_test.logs/run*/suite.log; then
                  exit 1
               fi
               ;;
          esac

      - name: Cleanup tests
        if: ${{ always() && matrix.type != 'debug' }}
        env:
          MATRIX_TYPE: ${{ matrix.type }}
        run: |
          if [ -d release/tests/test_server ]; then
             tar czf "${MATRIX_TYPE}_win32_test_results.tar.gz" \
                release/tests/test_server
          fi

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6.0.0
        if: ${{ always() && matrix.type != 'debug' }}
        with:
          name: ${{ matrix.type }}_win32_test_results
          path: ${{ matrix.type }}_win32_test_results.tar.gz
          if-no-files-found: ignore
