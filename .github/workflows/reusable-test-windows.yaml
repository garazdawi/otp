name: Test Erlang/OTP (Windows)
run-name: "[${{ inputs.base_branch }}] Test Erlang/OTP (Windows)"

on:
  workflow_call:
    inputs:
      base_branch:
        required: true
        type: string
      changes:
        required: true
        type: string
      installer_name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-windows:
    name: Test Win64 Erlang/OTP
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: wsl-bash {0}
    env:
      WSLENV: SSH_TEST_USER:SSH_TEST_HOME:MATRIX_TYPE
    permissions:
      contents: read
      actions: write
    strategy:
      matrix:
        type: ${{ fromJson(inputs.changes) }}
      fail-fast: false
    steps:
      - name: Setup nl behaviour for wsl
        shell: cmd
        run: git config --global core.autocrlf input

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-wsl-runner
        with:
          installer_name: ${{ inputs.installer_name }}

      - name: Install OpenSSH server
        if: matrix.type == 'ssh'
        shell: powershell
        run: |
          $capability = Get-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          if ($capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          }

          $sshDir = Join-Path $env:USERPROFILE '.ssh'
          $privateKey = Join-Path $sshDir 'id_ed25519'
          New-Item -ItemType Directory -Force $sshDir | Out-Null
          if (-not (Test-Path $privateKey)) {
            ssh-keygen.exe -q -t ed25519 -N '""' -f $privateKey
          }

          $authorizedKeys = Join-Path $env:ProgramData 'ssh\administrators_authorized_keys'
          Copy-Item "$privateKey.pub" $authorizedKeys -Force
          icacls.exe $authorizedKeys /inheritance:r /grant 'SYSTEM:F' /grant 'Administrators:F'

          $firewallRule = Get-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -ErrorAction SilentlyContinue
          if ($firewallRule) {
            Enable-NetFirewallRule -Name 'OpenSSH-Server-In-TCP'
          } else {
            New-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -DisplayName 'OpenSSH Server' `
              -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22
          }

          Set-Service -Name sshd -StartupType Automatic
          Start-Service sshd
          "SSH_TEST_USER=$env:USERNAME" >> $env:GITHUB_ENV
          "SSH_TEST_HOME=$($env:USERPROFILE -replace '\\', '/')" >> $env:GITHUB_ENV

      - name: Check native OpenSSL
        shell: powershell
        run: |
          $openssl = (Get-Command openssl.exe -ErrorAction Stop).Source
          & $openssl version -a

      - name: Run tests
        id: run-tests
        env:
          MATRIX_TYPE: ${{ matrix.type }}
        run: |
          set -x
          unzip -q tests.zip
          export ERL_TOP="$(pwd)"
          export MAKEFLAGS=-j$(($(nproc) + 2))

          eval `./otp_build env_win32 x64`

          export PATH="$PWD/release/win32/bin:$PATH"

          APP="${MATRIX_TYPE}"
          TYPE=opt
          ## Need to specialize for epmd, emulator and debug
          case "${APP}" in
            debug)
               echo "No debug tests on windows"
               ;;
            *)
               ## Run with the re-run-failed mechanism (ts_run reads
               ## CT_RERUN_FAILED=N): a failure that passes on an isolated
               ## re-run (flaky / leak-induced) does not gate; only failures
               ## that fail every re-run do. Force a clean exit with
               ## erlang:halt/0 because socket_ttest_SUITE leaks a peer node
               ## that otherwise blocks init:stop() for hours.
               find release/tests -name ct_rerun_verdict -delete 2>/dev/null || true
               if [ -f "release/tests/${APP}_test/${APP}_gh.spec" ]; then
                  RUN_TESTS="ts:run_category(${APP},gh,[batch])"
               else
                  RUN_TESTS="ts:run(${APP},[batch])"
               fi

               ## Some suites finish and write their verdict, but leave a Windows
               ## process holding the WSL stdio pipe open. Log the remaining
               ## processes before terminating Erlang so the leak can be traced.
               VERDICT="release/tests/${APP}_test/ct_rerun_verdict"
               powershell.exe -NoProfile -Command \
                  'Get-CimInstance Win32_Process | Where-Object Name -eq "conhost.exe" | Select-Object -ExpandProperty ProcessId' \
                  > .ct_conhost_baseline
               (
                  set +x
                  while [ ! -f "$VERDICT" ]; do sleep 5; done
                  sleep 15
                  echo "::warning::Test verdict exists, but erl.exe has not exited; dumping Windows processes"
                  powershell.exe -NoProfile -Command \
                     '$processes = @(Get-CimInstance Win32_Process);
                      $byPid = @{};
                      $processes | ForEach-Object { $byPid[[uint32]$_.ProcessId] = $_ };
                      function Get-Ancestry($process) {
                        $parts = @(); $seen = @{}; $current = $process;
                        while ($null -ne $current -and -not $seen.ContainsKey([uint32]$current.ProcessId)) {
                          $seen[[uint32]$current.ProcessId] = $true;
                          $parts += "$($current.Name)($($current.ProcessId))";
                          $current = $byPid[[uint32]$current.ParentProcessId]
                        };
                        $parts -join " <- "
                      };
                      $interesting = $processes | Where-Object { @("erl.exe", "werl.exe", "epmd.exe", "inet_gethost.exe", "conhost.exe") -contains $_.Name };
                      $interesting | Sort-Object ParentProcessId,ProcessId | Select-Object Name,ProcessId,ParentProcessId,CreationDate,ExecutablePath,CommandLine,@{Name="Ancestry";Expression={ Get-Ancestry $_ }} | Format-List | Out-String -Width 4096;
                      $baseline = @(Get-Content .ct_conhost_baseline -ErrorAction SilentlyContinue | ForEach-Object { [uint32]$_ });
                      $orphans = @($interesting | Where-Object { $_.Name -eq "conhost.exe" -and -not $byPid.ContainsKey([uint32]$_.ParentProcessId) -and -not ($baseline -contains [uint32]$_.ProcessId) });
                      $orphans | ForEach-Object { Write-Warning "Terminating orphaned test conhost.exe PID $($_.ProcessId)"; Stop-Process -Id $_.ProcessId -Force -ErrorAction Continue }'
                  epmd.exe -names || true
                  netstat.exe -ano || true
                  taskkill.exe /F /T /IM erl.exe || true
                  taskkill.exe /F /IM epmd.exe || true
               ) &
               WATCHDOG=$!
               ERL_USER="${SSH_TEST_USER:-${USER}}"
               ERL_HOME="${SSH_TEST_HOME:-${HOME}}"
               (cd release/tests/test_server && erl.exe -env USER "$ERL_USER" -env HOME "$ERL_HOME" -env OTP_WINDOWS_CI true -env CT_RERUN_FAILED 2 -emu_type $TYPE -noinput -eval "ts:install()" -eval "(catch ${RUN_TESTS}), erlang:halt()") || true
               kill "$WATCHDOG" 2>/dev/null || true
               wait "$WATCHDOG" 2>/dev/null || true
               rm -f .ct_conhost_baseline
               VERDICT=$(find release/tests -name ct_rerun_verdict 2>/dev/null | head -1)
               if [ -n "$VERDICT" ]; then
                  echo "ct_rerun verdict: $(cat "$VERDICT")"
                  if grep -q '^FAIL' "$VERDICT"; then exit 1; fi
               elif grep "^=result[ ]*failed:" release/tests/test_server/ct_run.*/tests.${APP}_test.logs/run*/suite.log; then
                  exit 1
               fi
               ;;
          esac

      - name: Cleanup tests
        if: ${{ always() && matrix.type != 'debug' }}
        env:
          MATRIX_TYPE: ${{ matrix.type }}
        run: |
          if [ -d release/tests/test_server ]; then
             tar czf "${MATRIX_TYPE}_win32_test_results.tar.gz" \
                release/tests/test_server
          fi

      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # ratchet:actions/upload-artifact@v6.0.0
        if: ${{ always() && matrix.type != 'debug' }}
        with:
          name: ${{ matrix.type }}_win32_test_results
          path: ${{ matrix.type }}_win32_test_results.tar.gz
          if-no-files-found: ignore
